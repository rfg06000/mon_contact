<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner une carte de visite → VCF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.6s ease-out; }
        .spinner {
            border: 3px solid #e5e7eb;
            border-top-color: #7c3aed;
            border-radius: 50%;
            width: 1.25rem;
            height: 1.25rem;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-purple-50 min-h-screen p-4">
    <div class="max-w-md mx-auto fade-in pb-10">
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-6 text-white text-center">
                <h1 class="text-xl font-bold mb-1">Carte de visite → Contact</h1>
                <p class="text-blue-100 text-sm">Photographiez ou importez une carte, vérifiez, puis créez le .vcf</p>
            </div>

            <div class="p-6 space-y-5">
                <!-- Step 1: image -->
                <div id="step1">
                    <label class="block text-sm font-medium text-gray-700 mb-2">1. Photo ou capture d'écran</label>
                    <label class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-xl p-6 cursor-pointer hover:border-purple-400 transition-colors">
                        <svg class="w-8 h-8 text-purple-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        <span class="text-sm text-gray-600 text-center">Toucher pour prendre une photo<br>ou choisir une image</span>
                        <input id="fileInput" type="file" accept="image/*" class="hidden">
                    </label>
                    <img id="preview" class="mt-3 rounded-xl w-full hidden" alt="Aperçu">
                    <button id="analyzeBtn" disabled
                        class="mt-4 w-full py-3 rounded-xl font-semibold text-white transition-all duration-300 flex items-center justify-center space-x-2 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 disabled:opacity-40 disabled:cursor-not-allowed">
                        <span id="analyzeLabel">Analyser l'image</span>
                    </button>
                    <p id="progressText" class="text-center text-xs text-gray-500 mt-2"></p>
                </div>

                <!-- Step 2: review & correct -->
                <div id="step2" class="hidden space-y-4 border-t border-gray-100 pt-4">
                    <p class="text-sm font-medium text-gray-700">2. Vérifiez et corrigez les informations lues</p>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Prénom</label>
                            <input id="fPrenom" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Nom</label>
                            <input id="fNom" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Société</label>
                            <input id="fCompany" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Fonction</label>
                            <input id="fTitle" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Téléphones</label>
                        <div id="phoneRows" class="space-y-2"></div>
                        <button type="button" id="addPhone" class="mt-2 text-xs font-medium text-purple-600 hover:text-purple-800">+ Ajouter un téléphone</button>
                    </div>

                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Emails</label>
                        <div id="emailRows" class="space-y-2"></div>
                        <button type="button" id="addEmail" class="mt-2 text-xs font-medium text-purple-600 hover:text-purple-800">+ Ajouter un email</button>
                    </div>

                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Site web</label>
                        <input id="fUrl" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                    </div>

                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Adresse</label>
                        <textarea id="fAddress" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Autres informations lues (non classées)</label>
                        <textarea id="fNotes" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"></textarea>
                    </div>

                    <details class="text-xs text-gray-500">
                        <summary class="cursor-pointer select-none">Texte brut reconnu (référence)</summary>
                        <textarea id="fRaw" rows="5" class="w-full border border-gray-200 rounded-lg px-3 py-2 mt-2 text-xs font-mono"></textarea>
                    </details>

                    <button id="generateBtn"
                        class="w-full py-4 rounded-xl font-semibold text-white transition-all duration-300 flex items-center justify-center space-x-2 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 shadow-lg hover:shadow-xl">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                        </svg>
                        <span>Générer le fichier VCF</span>
                    </button>
                    <p class="text-center text-xs text-gray-500">Le fichier .vcf s'ouvrira dans l'app Contacts de votre iPhone</p>
                </div>
            </div>
        </div>

        <div class="text-center mt-6 text-sm text-gray-600">
            <a href="index.html" class="text-purple-600 hover:text-purple-800 font-medium">← Retour à ma carte</a>
        </div>
    </div>

    <script>
        var fileInput = document.getElementById('fileInput');
        var preview = document.getElementById('preview');
        var analyzeBtn = document.getElementById('analyzeBtn');
        var analyzeLabel = document.getElementById('analyzeLabel');
        var progressText = document.getElementById('progressText');
        var step2 = document.getElementById('step2');
        var selectedFile = null;

        fileInput.addEventListener('change', function () {
            var file = fileInput.files && fileInput.files[0];
            if (!file) return;
            selectedFile = file;
            preview.src = URL.createObjectURL(file);
            preview.classList.remove('hidden');
            analyzeBtn.disabled = false;
        });

        function escRe(str) { return str; }

        function parseCardText(text) {
            var rawLines = text.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(function (l) { return l.length > 0; });

            var emails = [];
            var urls = [];
            var phones = [];
            var addressLines = [];
            var otherLines = [];

            var emailRe = /[\w.+-]+@[\w-]+\.[\w.-]+/;
            var urlRe = /(https?:\/\/\S+|www\.\S+)/i;
            var phoneRe = /(\+?\d[\d .()-]{7,}\d)/;
            var addressKeywordRe = /\b(rue|avenue|av\.|boulevard|bd\.|blvd|allée|allee|chemin|impasse|place|route|cours|quai|street|st\.|road|rd\.|résidence|residence)\b/i;
            var postalCodeRe = /\b\d{5}\b/;

            for (var i = 0; i < rawLines.length; i++) {
                var line = rawLines[i];
                var matched = false;

                var emailMatch = line.match(emailRe);
                if (emailMatch) {
                    emails.push(emailMatch[0]);
                    matched = true;
                }

                if (!emailMatch) {
                    var urlMatch = line.match(urlRe);
                    if (urlMatch) {
                        urls.push(urlMatch[0]);
                        matched = true;
                    }
                }

                if (!matched) {
                    var phoneMatch = line.match(phoneRe);
                    if (phoneMatch) {
                        var digits = phoneMatch[0].replace(/\D/g, '');
                        if (digits.length >= 9) {
                            phones.push(phoneMatch[0].trim());
                            matched = true;
                        }
                    }
                }

                if (!matched && (addressKeywordRe.test(line) || postalCodeRe.test(line))) {
                    addressLines.push(line);
                    matched = true;
                }

                if (!matched) {
                    otherLines.push(line);
                }
            }

            var name = otherLines.shift() || '';
            var company = otherLines.shift() || '';
            var notes = otherLines.join('\n');

            return {
                name: name,
                company: company,
                emails: emails,
                urls: urls,
                phones: phones,
                address: addressLines.join('\n'),
                notes: notes,
                rawText: text
            };
        }

        function addPhoneRow(type, value) {
            var container = document.getElementById('phoneRows');
            var row = document.createElement('div');
            row.className = 'flex items-center space-x-2';
            row.innerHTML =
                '<select class="phone-type border border-gray-300 rounded-lg px-2 py-2 text-xs">' +
                '<option value="CELL">Mobile</option>' +
                '<option value="WORK,VOICE">Fixe</option>' +
                '<option value="FAX">Fax</option>' +
                '<option value="OTHER">Autre</option>' +
                '</select>' +
                '<input type="tel" class="phone-value flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="+33 6 12 34 56 78">' +
                '<button type="button" class="remove-row text-gray-400 hover:text-red-500 px-1">✕</button>';
            row.querySelector('.phone-type').value = type || 'CELL';
            row.querySelector('.phone-value').value = value || '';
            row.querySelector('.remove-row').addEventListener('click', function () { row.remove(); });
            container.appendChild(row);
        }

        function addEmailRow(type, value) {
            var container = document.getElementById('emailRows');
            var row = document.createElement('div');
            row.className = 'flex items-center space-x-2';
            row.innerHTML =
                '<select class="email-type border border-gray-300 rounded-lg px-2 py-2 text-xs">' +
                '<option value="WORK">Travail</option>' +
                '<option value="HOME">Perso</option>' +
                '</select>' +
                '<input type="email" class="email-value flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="nom@exemple.com">' +
                '<button type="button" class="remove-row text-gray-400 hover:text-red-500 px-1">✕</button>';
            row.querySelector('.email-type').value = type || 'WORK';
            row.querySelector('.email-value').value = value || '';
            row.querySelector('.remove-row').addEventListener('click', function () { row.remove(); });
            container.appendChild(row);
        }

        document.getElementById('addPhone').addEventListener('click', function () { addPhoneRow('CELL', ''); });
        document.getElementById('addEmail').addEventListener('click', function () { addEmailRow('WORK', ''); });

        function fillForm(parsed) {
            var parts = parsed.name.split(/\s+/).filter(Boolean);
            var prenom = parts.length > 1 ? parts[0] : '';
            var nom = parts.length > 1 ? parts.slice(1).join(' ') : parsed.name;

            document.getElementById('fPrenom').value = prenom;
            document.getElementById('fNom').value = nom;
            document.getElementById('fCompany').value = parsed.company;
            document.getElementById('fTitle').value = '';
            document.getElementById('fUrl').value = parsed.urls[0] || '';
            document.getElementById('fAddress').value = parsed.address;
            document.getElementById('fNotes').value = parsed.notes;
            document.getElementById('fRaw').value = parsed.rawText;

            document.getElementById('phoneRows').innerHTML = '';
            document.getElementById('emailRows').innerHTML = '';

            if (parsed.phones.length === 0) {
                addPhoneRow('CELL', '');
            } else {
                parsed.phones.forEach(function (p, idx) { addPhoneRow(idx === 0 ? 'CELL' : 'WORK,VOICE', p); });
            }

            if (parsed.emails.length === 0) {
                addEmailRow('WORK', '');
            } else {
                parsed.emails.forEach(function (e) { addEmailRow('WORK', e); });
            }

            step2.classList.remove('hidden');
            step2.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        analyzeBtn.addEventListener('click', function () {
            if (!selectedFile) return;
            analyzeBtn.disabled = true;
            analyzeLabel.innerHTML = '<span class="spinner inline-block align-middle mr-2"></span>Analyse en cours…';
            progressText.textContent = 'Chargement du moteur de reconnaissance…';

            Tesseract.recognize(selectedFile, 'fra+eng', {
                logger: function (m) {
                    if (m.status && typeof m.progress === 'number') {
                        var pct = Math.round(m.progress * 100);
                        var label = m.status === 'recognizing text' ? 'Lecture du texte' : m.status;
                        progressText.textContent = label + '… ' + pct + '%';
                    }
                }
            }).then(function (result) {
                var parsed = parseCardText(result.data.text || '');
                fillForm(parsed);
                progressText.textContent = 'Analyse terminée. Vérifiez les champs ci-dessous.';
            }).catch(function (err) {
                console.error(err);
                progressText.textContent = "Erreur lors de l'analyse : " + (err && err.message ? err.message : err);
            }).finally(function () {
                analyzeBtn.disabled = false;
                analyzeLabel.textContent = 'Analyser l\'image';
            });
        });

        function escapeVcf(str) {
            return String(str || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,');
        }

        document.getElementById('generateBtn').addEventListener('click', function () {
            var prenom = document.getElementById('fPrenom').value.trim();
            var nom = document.getElementById('fNom').value.trim();
            var company = document.getElementById('fCompany').value.trim();
            var title = document.getElementById('fTitle').value.trim();
            var url = document.getElementById('fUrl').value.trim();
            var address = document.getElementById('fAddress').value.trim();
            var notes = document.getElementById('fNotes').value.trim();

            var fn = (prenom + ' ' + nom).trim() || company || 'Contact';

            var vcard = 'BEGIN:VCARD\n';
            vcard += 'VERSION:3.0\n';
            vcard += 'N:' + escapeVcf(nom) + ';' + escapeVcf(prenom) + ';;;\n';
            vcard += 'FN:' + escapeVcf(fn) + '\n';
            if (company) vcard += 'ORG:' + escapeVcf(company) + '\n';
            if (title) vcard += 'TITLE:' + escapeVcf(title) + '\n';

            document.querySelectorAll('#phoneRows > div').forEach(function (row) {
                var type = row.querySelector('.phone-type').value;
                var value = row.querySelector('.phone-value').value.trim();
                if (value) vcard += 'TEL;TYPE=' + type + ':' + value + '\n';
            });

            document.querySelectorAll('#emailRows > div').forEach(function (row) {
                var type = row.querySelector('.email-type').value;
                var value = row.querySelector('.email-value').value.trim();
                if (value) vcard += 'EMAIL;TYPE=' + type + ':' + value + '\n';
            });

            if (url) vcard += 'URL:' + escapeVcf(url) + '\n';
            if (address) vcard += 'ADR;TYPE=WORK:;;' + escapeVcf(address.replace(/\n/g, ', ')) + ';;;;\n';
            if (notes) vcard += 'NOTE:' + escapeVcf(notes) + '\n';
            vcard += 'END:VCARD';

            var blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
            var url2 = window.URL.createObjectURL(blob);
            var link = document.createElement('a');
            link.href = url2;
            var filenameBase = (nom || prenom || company || 'contact').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'contact';
            link.download = filenameBase + '.vcf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url2);
        });

        addPhoneRow('CELL', '');
        addEmailRow('WORK', '');
    </script>
</body>
</html>
